<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>Bee Licitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bee:#FDDC00; --bee-deep:#E3C300; --bee-soft:#FFF4B8;
  --top:#1E1C1C; --top-ink:#F6F4EC;
  --bg:#F1F1EE; --surface:#FFFFFF; --col:#E7E7E2; --line:#D9D8D0; --line-soft:#E9E8E1;
  --ink:#1E1C1C; --muted:#67645C; --faint:#94918A;
  --e1:#2FAE7C; --e2:#EBC000; --e3:#EE8A22; --e4:#E5484D;
  --bad:#B4232A; --bad-bg:#FDE4E3; --ok:#1E7B55; --ok-bg:#DDF3E8;
  --shadow:0 1px 2px rgba(30,28,28,.06),0 4px 14px rgba(30,28,28,.06);
  --ov:rgba(20,19,19,.55);
  --f-d:'Outfit','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141313; --surface:#1F1E1D; --col:#191817; --line:#34312D; --line-soft:#2A2825;
  --ink:#F3F1EA; --muted:#A9A69C; --faint:#77746C; --bee-soft:#3A3410;
  --bad:#FF8D8D; --bad-bg:#3B1B1C; --ok:#67D39F; --ok-bg:#14301F; --ov:rgba(0,0,0,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#141313; --surface:#1F1E1D; --col:#191817; --line:#34312D; --line-soft:#2A2825;
  --ink:#F3F1EA; --muted:#A9A69C; --faint:#77746C; --bee-soft:#3A3410;
  --bad:#FF8D8D; --bad-bg:#3B1B1C; --ok:#67D39F; --ok-bg:#14301F; --ov:rgba(0,0,0,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:14px/1.45 var(--f-b);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bee-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance}

/* ---------- topo (identidade do papel timbrado) ---------- */
.top{background:var(--top);color:var(--top-ink);position:relative;padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top::after{content:"";display:block;height:14px;margin:0 -16px;background:var(--bee);clip-path:polygon(0 45%,58% 45%,61% 0,100% 0,100% 100%,0 100%)}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:46px;width:auto;display:block}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{font-size:19px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:12px;color:#B9B6AB}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:#B9B6AB}
.who select{background:#2C2A29;border:1px solid #47443F;color:var(--top-ink);border-radius:8px;padding:6px 8px;max-width:160px}
.bell{position:relative;background:#2C2A29;border:1px solid #47443F;color:var(--top-ink);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.bell .n[hidden]{display:none}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--bee);color:#1E1C1C;font:700 11px/1 var(--f-d);min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#D0CDC2;padding:8px 14px;border-radius:9px 9px 0 0;font:600 13.5px var(--f-d);letter-spacing:.02em;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--bee);color:#1E1C1C}
.top-tabs-wrap{position:relative;z-index:1}
.tab .chev{display:inline-block;margin-left:5px;font-size:10px;opacity:.75}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 2px;position:relative;z-index:1}
.subtabs:empty{display:none}
.stab{background:#2C2A29;border:1px solid #47443F;color:#D0CDC2;border-radius:999px;padding:5px 12px;font:600 12.5px var(--f-d);white-space:nowrap}
.stab:hover{color:#fff;border-color:#6b675f}
.stab[aria-current="true"]{background:var(--bee);color:#1E1C1C;border-color:var(--bee)}
.stab .tb-n{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--bee);color:#1E1C1C;font:700 10px/1 var(--f-d)}
.stab[aria-current="true"] .tb-n{background:#1E1C1C;color:var(--bee)}
.top::after{position:relative;z-index:0}

/* ---------- geral ---------- */
main{padding:16px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--bee);border-color:var(--bee-deep);color:#1E1C1C}
.btn.pri:hover{background:var(--bee-deep)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.hoje{background:var(--bee);color:#1E1C1C}
.chip.amanha{background:var(--bee-soft);color:var(--ink)}
.chip.atraso{background:var(--bad-bg);color:var(--bad)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.rem{background:transparent;border:1px solid var(--e3);color:var(--e3)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 10.5px var(--f-d);flex:none}
.av.sem{background:transparent;border:1px dashed var(--faint);color:var(--faint)}

/* ---------- barra de ferramentas ---------- */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=date],.tools input[type=month],.tools input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;color:inherit}
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pbar label{font-weight:600;font-size:13px}
.pbar .pn{width:90px}
.pbar .sum{color:var(--muted,#6b6860);font-size:13px}
.tools input[type=search],.tools select,.pbar select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.tools input[type=search]{flex:1 1 180px;max-width:280px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 11px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}

/* ---------- faixa de alertas ---------- */
.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.strip strong{font-family:var(--f-d);font-weight:600}
.strip .sep{color:var(--faint)}

/* ---------- quadro ---------- */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.col{flex:0 0 274px;background:var(--col);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 250px);min-height:120px}
.col.over{outline:2px dashed var(--bee-deep);outline-offset:-3px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h h3{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex:1}
.col-h .ct{font:600 12px var(--f-d);color:var(--muted);background:var(--surface);border-radius:999px;padding:1px 8px}
.col-h .add{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.col-h .add:hover{background:var(--surface);color:var(--ink)}
.col-b{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:1px}
.empty{color:var(--faint);font-size:12.5px;padding:10px 6px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:grid;gap:7px;text-align:left;width:100%;cursor:pointer}
.card:hover{border-color:var(--bee-deep);box-shadow:var(--shadow)}
.card.drag{opacity:.4}
.card .r1{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .org{font:600 14.5px/1.25 var(--f-d)}
.card .num{color:var(--muted);font-size:12.5px;margin-top:-4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:center}
.steps i{height:5px;border-radius:3px;background:transparent;border:1px solid var(--line)}
.steps i.done{border-color:transparent}
.steps i.cur{border-color:transparent;height:9px}
.steps i:nth-child(1){color:var(--e1)} .steps i:nth-child(2){color:var(--e2)} .steps i:nth-child(3){color:var(--e3)} .steps i:nth-child(4){color:var(--e4)}
.steps i.done,.steps i.cur{background:currentColor}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.foot .sp{flex:1}
.flag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ---------- agenda ---------- */
.agenda{display:grid;gap:18px;max-width:900px}
.day h3{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-soft);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--col)}
.row .t{font:600 16px var(--f-d);font-variant-numeric:tabular-nums}
.row .m{color:var(--muted);font-size:12.5px}
.row .who2{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:640px){.row{grid-template-columns:52px 1fr}.row .who2{grid-column:2;justify-content:flex-start}}

/* ---------- painel ---------- */
.kpis{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.kpi{flex:1 1 180px;padding:14px 18px;border-right:1px solid var(--line-soft)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font:600 34px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:16px;font-weight:600}
.panel p.sub{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.bars{display:grid;gap:9px}
.bar small{color:var(--muted);font-size:11px}
.bar{display:grid;grid-template-columns:130px 1fr 116px;gap:10px;align-items:center;font-size:13px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.bar .tr{height:12px;background:var(--line-soft);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .vl b{color:var(--ink)}
@media (max-width:480px){.bar{grid-template-columns:92px 1fr 104px}}

/* ---------- equipe / historico ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:900px}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600}
.li .ct{color:var(--muted);font-size:12.5px}
.li .grow{flex:1 1 200px;min-width:0}
.form-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px;background:var(--col);border-radius:12px;margin:12px 0;max-width:900px}
.hist .li{align-items:flex-start}
.hist time{font:600 12px var(--f-d);color:var(--muted);width:118px;flex:none;font-variant-numeric:tabular-nums}

/* ---------- formulario / modal ---------- */
.f{display:grid;gap:4px}
.f>span{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:88px}
.f input:disabled,.f select:disabled{background:var(--col);color:var(--muted);cursor:not-allowed}
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:min(960px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.m-h{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--top);color:var(--top-ink)}
.m-h h2{flex:1;font-size:17px;font-weight:600}
.m-h .x{background:transparent;border:0;color:var(--top-ink);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px}
.m-h .x:hover{background:#3A3736}
.m-b{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0}
.m-l{padding:18px;display:grid;gap:14px;align-content:start}
.m-r{padding:18px;border-left:1px solid var(--line-soft);background:var(--bg);display:grid;gap:14px;align-content:start}
@media (max-width:760px){.m-b{grid-template-columns:1fr}.m-r{border-left:0;border-top:1px solid var(--line-soft)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}}
.flags{display:flex;flex-wrap:wrap;gap:8px 16px}
.flags label{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.m-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-top:1px solid var(--line-soft)}
.m-f .sp{flex:1}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper .chip{border:1px solid var(--line);background:transparent}
.stepper .chip.on{color:#1E1C1C;border-color:transparent}
.cmts{display:grid;gap:10px}
.cm{background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.cm .h{font-size:11.5px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.cm .h b{color:var(--ink)}
.cm-new{display:grid;gap:6px}
.log{display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.log div{display:grid;grid-template-columns:96px 1fr;gap:8px}
.log time{font-variant-numeric:tabular-nums;color:var(--faint)}
.m-r h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- sino ---------- */
.pop{position:absolute;right:16px;top:calc(100% - 4px);width:min(380px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:15;overflow:hidden}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.pop-h b{font-family:var(--f-d)}
.pop-l{max-height:340px;overflow:auto}
.nt{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);padding:10px 14px}
.nt:hover{background:var(--col)}
.nt.un{background:var(--bee-soft)}
.nt small{display:block;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
/* ---------- login ---------- */
.login{display:grid;place-items:start center;padding:6vh 0}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(400px,100%);box-shadow:var(--shadow)}
.login-card h2{font-size:20px;margin-bottom:14px}
.login-card a{color:var(--ink)}
.top .btn{background:#2C2A29;border-color:#47443F;color:var(--top-ink)}
.top .btn:hover{border-color:#77736C}
.who .nm{color:var(--top-ink);font-weight:600}

/* ---------- v2: início, metas, funil, processo, conversas ---------- */
.tab .tb-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--bee);color:#1E1C1C;font:700 10.5px/1 var(--f-d)}
.tab[aria-selected="true"] .tb-n{background:#1E1C1C;color:var(--bee)}
.meter{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:3px}
.meter i.ok{background:var(--ok)}
.kpi .meter{max-width:260px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media (max-width:520px){.grid2.wide{grid-template-columns:1fr}}
.ph{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.hint{margin:10px 0 0;font-size:13px;color:var(--ink);background:var(--bee-soft);border-radius:8px;padding:8px 10px}
.sec-t{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{font-weight:600;border-bottom:0;background:var(--col)}
.tbl input,.tbl select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0}
.tbl .ct,.ct{color:var(--muted);font-size:12.5px}
input.mi{width:86px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
input.mi.own{border-color:var(--bee-deep);background:var(--bee-soft)}
input.mi:disabled{background:transparent;border-color:transparent;color:var(--ink)}
.fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fn{background:var(--bg);border-radius:10px;padding:10px 12px}
.fn span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fn b{font:600 22px/1.2 var(--f-d);font-variant-numeric:tabular-nums}
.fn small{color:var(--muted);margin-left:4px}
.tbl.funil td.fc{min-width:150px}
.fv{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.fv b{font:600 16px var(--f-d)}
.pp{display:flex;align-items:center;gap:8px;font-weight:600}
.pp-b{display:flex;gap:4px;margin-top:6px}
.pr-dt{display:flex;gap:10px}
.pr-dt input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.score{font:600 14px var(--f-d);color:var(--muted)}
.score b{font-size:26px;color:var(--ink)}
.score.ok b{color:var(--ok)} .score.low b{color:var(--bad)}
.seg.nota button{padding:5px 10px}
/* checklist no cartão */
.stage{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.stage-h{display:flex;align-items:baseline;gap:8px}
.stage-h h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1}
.stage-tabs{display:flex;flex-wrap:wrap;gap:6px}
.chip.st{border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.st.cur{border-color:var(--bee-deep)}
.chip.st.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck-grp{display:grid;gap:7px}
.ck-grp h4{font:600 13px var(--f-d);margin:2px 0 0}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.ck input[type=checkbox]{margin-top:2px;width:16px;height:16px;flex:none;accent-color:#2B8A74}
.ck input:checked+span{color:var(--muted);text-decoration:line-through}
.ckc{display:grid;gap:4px;cursor:default}
.ckc input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.ck-dica{font-size:12.5px;color:var(--ink);background:var(--bee-soft);border-radius:8px;padding:8px 10px;display:block}
.emp-l{display:grid;gap:4px}
.emp{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;padding:5px 9px}
.emp span{color:var(--muted);flex:1}
.emp.tot{background:transparent;border:0;padding:2px 0}
.emp-add{display:grid;grid-template-columns:120px 140px 1fr auto;gap:6px}
.emp-add input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
@media (max-width:640px){.emp-add{grid-template-columns:1fr 1fr}}
/* v7 — Compras */
.cp-tbl .cp-row{cursor:pointer}
.gargalo{margin:0 0 12px;font-size:13.5px;max-width:1100px}
.cfg-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-size:13px;color:var(--muted)}
.cfg-line>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.cfg-line .mi{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 6px;text-align:right}
.cp-tbl td:first-child{white-space:nowrap}
.cp-tbl td:nth-child(2){min-width:240px}
.cp-tbl .cp-row:hover td{background:var(--col)}
.cp-modal{width:min(1080px,100%)}
.cp-body{padding:16px 18px;display:grid;gap:14px}
.cp-sec{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.cp-sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.cp-sec .ph h3{margin:0}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 12px;align-items:start}
.cp-grid .cp-wide{grid-column:1/-1}
.cp-grid .f small{font-size:11.5px}
.cp-chk{align-self:center;padding-top:14px}
.req{color:var(--bad);font-style:normal}
.cp-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pf-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 12px;margin-top:10px}
.pf-card.bad{border-left-color:var(--bad)}
.pf-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 14px}
.kv span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv em{font-style:normal;font-size:13px}
.kv b{font-size:14px;font-variant-numeric:tabular-nums}
.pf-err{margin-top:8px;font-size:12.5px;color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:6px 9px}
.pf-av{margin-top:6px;font-size:12.5px;background:var(--bee-soft);border-radius:8px;padding:6px 9px}
.pf-form{background:var(--surface);border:1px dashed var(--bee-deep);border-radius:10px;padding:12px;margin-top:10px}
.pf-form h4{font:600 14px var(--f-d);margin:0 0 10px}
.pf-prev{margin-top:10px;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
.imp .fn small{display:block;margin:2px 0 0}
/* MFA */
.mfa-card{width:min(480px,100%)}
.mfa-steps{margin:0 0 14px;padding-left:20px;display:grid;gap:10px;font-size:13.5px}
.mfa-qr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;width:max-content;margin:8px 0}
.mfa-qr img{display:block;width:180px;height:180px}
.mfa-key{font:600 13px ui-monospace,Menlo,Consolas,monospace;background:var(--col);padding:2px 6px;border-radius:6px;word-break:break-all}
.f input.mfa-in,input.mfa-in{font:600 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pf-mfa{border-top:1px solid var(--line-soft);padding-top:12px}
.pf-mfa h3{font-size:15px}
.pf-add{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px}
/* v5 — contratos e pedidos */
.ctr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ctr .fn b{font-size:18px}
.ctr-st{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.ped-add{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.ped-add>input,.ped-add>select,.ped-add .mini input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;flex:1 1 120px}
.ped-add>input.wide{flex:3 1 260px}
.ped-add .mini{display:grid;gap:2px;flex:1 1 130px}
.ped-add .mini span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ped-add .btn{flex:0 0 auto}
.mt-ped .meter i{background:var(--e1)}
.ctr-list{max-width:1100px}
.ctr-li{align-items:flex-start}
.ctr-li .nm a{color:inherit}
.ctr-li .ln{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ctr-li .ln.ct{display:block}
.ctr-li a{color:inherit}
.ctr-act{display:flex;gap:8px;align-items:center}
.ctr-form{flex-basis:100%;border-top:1px dashed var(--line);padding-top:10px}
/* processo */
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.proc{grid-template-columns:1fr}}
.pg{font:600 13px var(--f-d);margin:12px 0 6px}
.pl{display:grid;gap:6px}
.pi{display:grid;grid-template-columns:86px 1fr auto auto auto;gap:6px;align-items:center}
.pi.ro{display:block;font-size:13px}
.pi input,.pi select,.pi-add input,.pi-add select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px;min-width:0;width:100%}
.pi-add{display:grid;grid-template-columns:1fr 86px;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pi-add input[data-col="texto"]{grid-column:1/2}
/* conversas */
.chat{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;max-width:1100px}
@media (max-width:760px){.chat{grid-template-columns:1fr}}
.chat-l{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start}
.cl-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px 4px}
.cv{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border:0;background:transparent;text-align:left;font-weight:600}
.cv:hover{background:var(--col)}
.cv[aria-current="true"]{background:var(--bee-soft)}
.cv .b{margin-left:auto;background:var(--bee);color:#1E1C1C;font:700 11px/1 var(--f-d);min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.chat-r{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:440px;max-height:calc(100vh - 190px)}
.cr-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.cr-h h2{font-size:16px;font-weight:600;flex:1}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px}
.msg .h{font-size:11.5px;color:var(--muted)}
.msg .h b{color:var(--ink)}
.msg .tx{white-space:normal;word-wrap:break-word}
.msg .task{margin-top:6px}
.compose{border-top:1px solid var(--line-soft);padding:10px;display:grid;gap:8px}
.compose textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);min-height:58px;resize:vertical;width:100%}
.cp-b{display:flex;gap:8px;align-items:center}
.cp-b .sp{flex:1}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.tf{grid-template-columns:1fr}}
.tasks{display:grid;gap:8px}
.task{border:1px solid var(--line);border-left:4px solid var(--bee);border-radius:9px;padding:9px 11px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.task input[type=checkbox]{margin-top:3px;width:16px;height:16px;flex:none;accent-color:#2B8A74}
.task .grow{flex:1;min-width:0}
.task .tt{font-weight:600}
.task.done{border-left-color:var(--ok);opacity:.7}
.task.done .tt{text-decoration:line-through}
.task a{color:inherit}
.mdel{border:0;background:transparent;color:var(--faint);font-size:11px;padding:0 4px;margin-left:4px;opacity:0;cursor:pointer}
.msg:hover .mdel,.mdel:focus{opacity:1}
.mdel:hover{color:var(--bad);text-decoration:underline}
@media (hover:none){.mdel{opacity:1}}
.pbar input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* ---------- datas ---------- */
function P(s){var m=/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)):null}
function z(n){return (n<10?'0':'')+n}
function hhmm(d){return z(d.getHours())+':'+z(d.getMinutes())}
function dm(d){return z(d.getDate())+'/'+z(d.getMonth()+1)}

function fmtShort(d){return DIAS[d.getDay()]+' '+dm(d)+' · '+hhmm(d)}

function fmtISO(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayDiff(d){return Math.round((sod(d)-sod(S.now))/864e5)}

/* ---------- regras de negócio ---------- */
function faseNome(k){for(var i=0;i<FASES.length;i++)if(FASES[i].k===k)return FASES[i].n;return k||'—'}
function ativa(b){return FINAIS.indexOf(b.fase)<0}
function due(b){
  var d=P(b.disputa);
  if(!d) return {k:'sem',t:'Sem data',chip:''};
  if(!ativa(b)) return {k:'fim',t:dm(d)+' · '+hhmm(d),chip:''};
  var dd=dayDiff(d), early=INICIAIS.indexOf(b.fase)>=0;
  if(d<S.now&&early) return {k:'atraso',t:'Em atraso · '+dm(d),chip:'atraso'};
  if(d<S.now) return {k:'passou',t:fmtShort(d),chip:''};
  if(dd===0) return {k:'hoje',t:'Hoje '+hhmm(d),chip:'hoje'};
  if(dd===1) return {k:'amanha',t:'Amanhã '+hhmm(d),chip:'amanha'};
  if(dd<=7) return {k:'semana',t:fmtShort(d),chip:''};
  return {k:'depois',t:fmtShort(d),chip:''};

  for(var k=0;k<4;k++){

  return out;
}

/* ---------- utilidades ---------- */
function ymd(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pYMD(s){var m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){var x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function wkStart(){return addDays(monday(S.now),7*S.wk)}
function fRange(){
  if(S.fr&&S.fr.de&&S.fr.ate){var a=pYMD(S.fr.de),b=pYMD(S.fr.ate);if(a&&b){if(b<a){var t=a;a=b;b=t}return {a:a,b:addDays(b,1),custom:true}}}
  var w0=wkStart();return {a:w0,b:addDays(w0,7),custom:false};
}
function metaRange(uid,a,b){
  var t={an:0,pr:0,vi:0,em:0},own={an:false,pr:false,vi:false,em:false};
  for(var d=new Date(a);d<b;d=addDays(d,1)){var m=uid===undefined?metaTime(monday(d)):metaUser(uid,monday(d));t.an+=m.an/7;t.pr+=m.pr/7;t.vi+=m.vi/7;t.em+=m.em/7}
  return {an:Math.round(t.an),pr:Math.round(t.pr),vi:Math.round(t.vi*10)/10,em:Math.round(t.em/10)*10,own:own};
}
function brl(v){v=+v||0;var dec=Math.round(v)!==v&&Math.abs(v)<100000;return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0})}
function nf(v,d){return (+v||0).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d})}
function pn(s){s=String(s==null?'':s).replace(/\s|R\$|%/g,'');if(!s)return null;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isNaN(n)?null:n}
function inRange(s,a,b){if(!s)return false;var d=String(s).length<=10?pYMD(s):new Date(s);return !!d&&d>=a&&d<b}
function cfgv(){return S.cfg||CFG0}
function zeroOk(s){var z0=cfgv().funil_inicio;if(!z0)return true;if(!s)return false;var d=String(s).length<=10?pYMD(s):new Date(s);return d>=new Date(z0)||(String(s).length<=10&&ymd(d)===ymd(new Date(z0)))}
function adjSum(a,b,uid){return sumv(S.bids.filter(function(x){return x.adjudicadaEm&&zeroOk(x.adjudicadaEm)&&inRange(x.adjudicadaEm,a,b)&&(uid===undefined||(x.responsavel||'')===uid)}),function(x){return x.valorAdj})}

/* ---------- cálculo da meta ---------- */
function calc(){
  var c=cfgv(), A=+c.despesas_fixas||0, B=(+c.margem||0)/100, D=+c.empenho_vitoria||0, F=(+c.taxa_vitoria||0)/100, ap=+c.analisados_por_proposta||1;
  var C=B>0?A/B:0, E=D>0?Math.ceil(C/D):0, G=F>0?Math.ceil(E/F):0, sp=Math.ceil(G/4);
  return {A:A,B:B,C:C,D:D,E:E,F:F,G:G,ap:ap,sem:{propostas:sp,vitorias:E/4,analisados:Math.ceil(sp*ap),empenhado:C/4}};
}
function rampaRows(){
  var c=cfgv(), k=calc(), ini=pYMD(c.inicio), fim=pYMD(c.fim);
  return (c.rampa||[]).map(function(r,i){
    var m=/^(\d{4})-(\d\d)$/.exec(r.mes||'');if(!m)return null;
    var a=new Date(+m[1],+m[2]-1,1), b=new Date(+m[1],+m[2],0);
    if(ini&&ini>a)a=ini; if(fim&&fim<b)b=fim;

  function q(a,b){return b>0?a/b:1}
  var qa=q(r.an,m.an), qp=q(r.pr,m.pr), qv=q(r.vi,m.vi), qe=q(r.em,m.em);

  if(qp<0.8&&qp<qa-0.2) return 'Queda entre analisados e propostas: o gargalo é fornecedor ou edital.';

        if(ed) h+='<div class="pi"><select data-xc="pi" data-id="'+esc(it.id)+'" data-col="tipo" aria-label="Tipo">'+opt([{k:'check',n:'Caixa'},{k:'campo',n:'Campo'},{k:'dica',n:'Dica'}],it.tipo)+'</select>'+

    }
    h+='</section>';

  return h+'</div>';

function procAdd(f){
  var d=S.procNew[f]||{}, gs=groupsOf(f), last=gs.length?gs[gs.length-1].n:'';
  var texto=String(d.texto||'').trim(); if(!texto){toast('Escreva o texto do item.');return}
  var grupo=d.grupo!=null?String(d.grupo).trim():last;
  var mx=Math.max.apply(null,[0].concat(procDe(f).filter(function(i){return (i.grupo||'')===grupo}).map(function(i){return i.ordem})));
  if(!mx) mx=Math.max.apply(null,[0].concat(procDe(f).map(function(i){return i.ordem})));
  var later2=procDe(f).filter(function(i){return i.ordem>mx});
  var ups=later2.map(function(i){return S.sb.from('processo_itens').update({ordem:i.ordem+10}).eq('id',i.id)});
  Promise.all(ups).then(function(){return w(S.sb.from('processo_itens').insert({fase:f,grupo:grupo,tipo:d.tipo||'check',texto:texto,ordem:mx+5}),'Item incluído.')})
   .then(function(){S.procNew[f]={grupo:grupo,tipo:d.tipo||'check',texto:''};return loadProc()}).then(function(){renderMain();var i=$('#pn-'+f);if(i)i.focus()}).catch(function(){});
}
function procMove(id,d){
  var it=S.proc.filter(function(i){return i.id===id})[0]; if(!it) return;
  var l=procDe(it.fase).filter(function(i){return (i.grupo||'')===(it.grupo||'')}), ix=l.indexOf(it), o=l[ix+d]; if(!o) return;
  var a=it.ordem, b=o.ordem; if(a===b) b=a+d;
  Promise.all([S.sb.from('processo_itens').update({ordem:b}).eq('id',it.id),S.sb.from('processo_itens').update({ordem:a}).eq('id',o.id)]).then(loadProc).then(renderMain).catch(function(){});
}

/* ---------- conversas e tarefas ---------- */
function canalDe(m){return m.para_id?('dm:'+(m.autor_id===meId()?m.para_id:m.autor_id)):'geral'}
function naoLidas(canal){var t=S.leit[canal]?new Date(S.leit[canal]):null;return S.msgs.filter(function(m){return m.autor_id!==meId()&&canalDe(m)===canal&&(!t||new Date(m.criado)>t)}).length}
function totalNaoLidas(){if(nv('conversas')<1)return 0;var s={};S.msgs.forEach(function(m){if(m.autor_id!==meId())s[canalDe(m)]=1});return Object.keys(s).reduce(function(n,c){return n+naoLidas(c)},0)}
function minhasPend(){return S.tarefas.filter(function(t){return t.para_id===meId()&&!t.feita}).length}
function marcarLido(canal){
  if(!naoLidas(canal)) return;
  var last=S.msgs.filter(function(m){return canalDe(m)===canal}).slice(-1)[0], t=new Date(Math.max(Date.now(),last?new Date(last.criado).getTime():0)).toISOString();
  S.leit[canal]=t; renderTop(); if(S.tab==='conversas') renderMain();
  S.sb.from('leituras').upsert({usuario_id:meId(),canal:canal,lido_em:t},{onConflict:'usuario_id,canal'}).then(function(){});
}
function taskById(id){for(var i=0;i<S.tarefas.length;i++)if(S.tarefas[i].id===id)return S.tarefas[i];return null}
function taskHTML(t){
  var can=t.para_id===meId()||t.criado_por===meId()||S.isAdmin, late=t.prazo&&!t.feita&&pYMD(t.prazo)<sod(S.now), b=t.licitacao_id?fresh(t.licitacao_id):null;

    '<div class="ct">'+(t.privada?'Pessoal · ':'')+'Para '+esc(t.para_id===meId()?'você':nomeDe(t.para_id).split(' ')[0])+(t.criado_por&&t.criado_por!==t.para_id?' · de '+esc(t.criado_por===meId()?'você':nomeDe(t.criado_por).split(' ')[0]):'')+
    (t.prazo?' · <span class="chip'+(late?' atraso':'')+'">até '+esc(dm(pYMD(t.prazo)))+'</span>':'')+(b?' · <a href="#" data-open="'+esc(b.id)+'">'+esc(b.orgao)+'</a>':'')+'</div></div>'+
    ((t.criado_por===meId()||S.isAdmin)?'<button class="btn small ghost" data-x="trm" data-id="'+esc(t.id)+'" aria-label="Excluir tarefa">×</button>':'')+'</div>';

      (ms.length?ms.map(function(m){

   v5 — contratos, pedidos de fornecimento (empenho, AF, ordem de compra)
   e relacionamento com os órgãos que não pedem.
   Precisa do arquivo supabase/05-contratos-pedidos.sql.
   ===================================================================== */
var TIPOS_PED=[{k:'empenho',n:'Nota de empenho'},{k:'af',n:'Autorização de fornecimento'},{k:'oc',n:'Ordem de compra'},{k:'outro',n:'Outro nome…'}];
var CANAIS=[{k:'telefone',n:'Telefone'},{k:'whatsapp',n:'WhatsApp'},{k:'email',n:'E-mail'},{k:'visita',n:'Visita'},{k:'outro',n:'Outro'}];
var CTR_COLS={contrato_assinado:'Assinatura do contrato',vigencia_fim:'Fim da vigência',contato_setor:'Setor do contato',contato_nome:'Nome do contato',contato_fone:'Telefone do contato',contato_email:'E-mail do contato'};
function tipoCurto(t){return t==='empenho'?'Empenho':t==='af'?'AF':t==='oc'?'Ordem de compra':(t||'Pedido')}
function canalNome(k){for(var i=0;i<CANAIS.length;i++)if(CANAIS[i].k===k)return CANAIS[i].n;return k||''}
function fmtD(s){var d=pYMD(s);return d?dm(d)+'/'+d.getFullYear():'—'}
function diasEntre(a,b){return Math.round((sod(b)-sod(a))/864e5)}
function domId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'-')}
function loadContatos(){
  return un(S.sb.from('contatos_orgao').select('*').order('data',{ascending:false}).order('criado',{ascending:false}).limit(2000))
    .then(function(d){S.contatos=d.sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:(a.criado<b.criado?1:-1)});S.v5=true}).catch(function(e){S.contatos=[];S.v5=false;S.v5off=v2missing(e)?'falta':'erro'});
}
function pedidosDe(bid){return S.emp.filter(function(e){return e.licitacao_id===bid})}
function contatosDe(bid){return S.contatos.filter(function(c){return c.licitacao_id===bid})}
function pedSum(a,b){return sumv(S.emp.filter(function(e){return fresh(e.licitacao_id)&&inRange(e.data,a,b)}),function(e){return e.valor})}
function ctrCfg(){var c=cfgv();return {x:+c.dias_sem_pedido||30,y:+c.dias_esfriou||60,z:+c.dias_vigencia||60}}

/* Situação do contrato de uma licitação adjudicada */
function ctrInfo(b){
  var ps=pedidosDe(b.id), tot=sumv(ps,function(p){return p.valor}), adj=b.valorAdj;
  var saldo=adj==null?null:adj-tot, pct=adj>0?Math.min(100,Math.round(tot/adj*100)):null;
  var hoje=sod(S.now), c=ctrCfg(), ass=pYMD(b.contratoAssinado), venc=pYMD(b.vigenciaFim);
  var ult=null; ps.forEach(function(p){var d=pYMD(p.data);if(d&&(!ult||d>ult))ult=d});
  var cts=contatosDe(b.id), uc=cts[0]||null, temSaldo=saldo==null||saldo>0.009;
  var r={ps:ps,tot:tot,adj:adj,saldo:saldo,pct:pct,ass:ass,venc:venc,ult:ult,cts:cts,uc:uc,alertas:[],k:'ok',dias:null,falta:null};
  if(uc&&uc.proximo){r.prox=pYMD(uc.proximo);r.proxAtras=r.prox<=hoje}
  if(b.fase!=='adjudicada'){r.k='fora';return r}
  if(!ass){r.k='semdata';return r}
  if(venc&&venc<hoje){r.k='encerrado';return r}
  if(adj!=null&&!temSaldo){r.k='quitado';return r}
  if(!ps.length){r.dias=diasEntre(ass,hoje);if(r.dias>=c.x)r.alertas.push({k:'sem',t:'Sem pedido há '+r.dias+' dias',c:'Sem pedido '+r.dias+'d'});else r.k='aguarda'}
  else{r.dias=diasEntre(ult,hoje);if(r.dias>=c.y)r.alertas.push({k:'esf',t:'Sem novo pedido há '+r.dias+' dias',c:'Parado '+r.dias+'d'})}
  if(venc){r.falta=diasEntre(hoje,venc);if(r.falta<=c.z)r.alertas.push({k:'vig',t:'Vigência acaba em '+r.falta+' dia'+(r.falta===1?'':'s')+(saldo!=null?' com '+brl(saldo)+' de saldo':''),c:'Vigência '+r.falta+'d'})}
  if(r.alertas.length) r.k='atencao';
  return r;
}
function ctrAtencao(){
  if(!S.v5||nv('contratos')<1) return [];
  return S.bids.filter(function(b){return b.fase==='adjudicada'}).map(function(b){return {b:b,r:ctrInfo(b)}}).filter(function(x){return x.r.k==='atencao'||x.r.k==='semdata'});
}
/* Ordem de urgência: próximo contato vencido, sem contato recente, maior saldo parado */
function urg(x){
  var r=x.r, recente=r.uc&&diasEntre(pYMD(r.uc.data),S.now)<7;
  var p=r.k==='atencao'?(r.proxAtras?0:(recente&&!r.proxAtras?2:1)):(r.k==='semdata'?3:4);
  return p;
}
function porUrgencia(a,b){var d=urg(a)-urg(b);if(d)return d;return (b.r.saldo==null?b.r.tot:b.r.saldo)-(a.r.saldo==null?a.r.tot:a.r.saldo)}

function ctrStatusChips(r){
  var c=ctrCfg();
  if(r.k==='atencao') return r.alertas.map(function(a){return '<span class="chip atraso">'+esc(a.t)+'</span>'}).join('');
  if(r.k==='semdata') return '<span class="chip amanha">Falta a data de assinatura</span>';
  if(r.k==='aguarda') return '<span class="chip">Aguardando 1º pedido · alerta em '+Math.max(0,c.x-r.dias)+' dia'+(c.x-r.dias===1?'':'s')+'</span>';
  if(r.k==='quitado') return '<span class="chip ok">Contrato todo pedido</span>';
  if(r.k==='encerrado') return '<span class="chip">Vigência encerrada</span>';
  if(r.k==='fora') return '';
  return '<span class="chip ok">Pedidos em dia</span>';
}
function ctrChip(b){
  if(!S.v5||nv('contratos')<1||b.fase!=='adjudicada') return '';
  var r=ctrInfo(b);
  if(r.k==='atencao') return '<span class="chip atraso" title="'+esc(r.alertas.map(function(a){return a.t}).join(' · '))+'">'+esc(r.alertas[0].c)+'</span>';
  if(r.k==='semdata') return '<span class="chip amanha" title="Preencha a data de assinatura do contrato">Sem data do contrato</span>';
  if(r.pct!=null&&r.ps.length) return '<span class="chip'+(r.pct>=100?' ok':'')+'" title="Quanto do contrato já foi pedido">Pedido '+r.pct+'%</span>';
  if(r.k==='aguarda') return '<span class="chip" title="Contrato assinado, aguardando o 1º pedido">Aguardando pedido</span>';
  return '';
}

function byId(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}

function cnpjFmt(c){c=String(c||'').replace(/\D/g,'');return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):c}
function cnpjOk(c){
  c=String(c||'').replace(/\D/g,''); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  function dv(n){var s=0,p=n-7;for(var i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}var r=s%11;return r<2?0:11-r}
  return dv(12)===+c[12]&&dv(13)===+c[13];
}
function mvaAjust(mva,inter,intra){return (1+ +mva)*(1-inter)/(1-intra)-1}

/* Custo exato de uma linha produto×fornecedor, no formato da Calculadora (colunas I, J, L, M, N, O, U, V) */
function custoInfo(pf){
  var p=prodById(pf.produto_id), f=fornById(pf.fornecedor_id), rg=p?regraById(p.regra_id):null;
  var desc=pf.desconto_override!=null?+pf.desconto_override:+((f&&f.desconto_avista)||0);
  var I=(+pf.preco_volume)*(1-desc)/(+pf.qtd_por_volume);
  var mg=!!(f&&f.origem_uf==='MG'), intra=rg?+rg.aliquota_interna:null;
  var icmsAuto=f&&f.origem_uf?(mg?intra:(pf.importado?0.04:0.12)):null, icms=pf.icms_origem!=null&&pf.icms_origem!==''?+pf.icms_origem:icmsAuto, inter=mg?null:icms;
  var L='',N=null;
  if(rg&&f&&f.origem_uf){
    if(mg) L=rg.icms_tipo==='st'?'ST já pago na nota':rg.icms_tipo==='st_mono'?'ST já pago + monofásico':'Nenhum';
    else{L=rg.icms_tipo==='st'?'ICMS-ST':rg.icms_tipo==='st_mono'?'ICMS-ST + monofásico':'Antecipação';
      if(rg.icms_tipo!=='normal'&&rg.mva_original!=null) N=mvaAjust(rg.mva_original,inter,intra)}
  }
  var ft=pf.frete_tipo_override||(f&&f.frete_tipo)||'';
  var U=(ft==='busca'||ft==='terceiro')&&f&&f.frete_viagem!=null?+f.frete_viagem:null, V=ft==='terceiro'?'Sim':'Não';
  var errs=[],avisos=[];
  if(!p) errs.push('produto não encontrado'); else if(!p.ativo) errs.push('produto inativo');
  if(!f) errs.push('fornecedor não encontrado'); else{if(f.status==='bloqueado')errs.push('fornecedor bloqueado');if(!f.origem_uf)errs.push('fornecedor sem UF de origem')}
  if(!rg) errs.push('produto sem regra fiscal'); else{if(!rg.validado)errs.push('regra fiscal '+rg.ncm+(rg.cest?'/'+rg.cest:'')+' não validada pelo contador');if(rg.icms_tipo!=='normal'&&rg.mva_original==null)errs.push('regra com ST sem MVA')}
  if(!ft) errs.push('tipo de frete não informado'); else if((ft==='busca'||ft==='terceiro')&&U==null) errs.push('custo da viagem não informado no fornecedor');
  var dt=pf.cotacao_data||(f&&f.tabela_data)||'', val=pf.cotacao_validade||(f&&f.tabela_validade)||'';
  if(!dt) errs.push('cotação sem data');
  if(!val) errs.push('cotação sem validade'); else if(pYMD(val)<sod(S.now)) errs.push('cotação vencida em '+fmtD(val));
  if(pf.status==='a_confirmar') errs.push('custo marcado como "a confirmar"');
  if(mg&&rg&&rg.icms_tipo!=='normal') avisos.push('fornecedor de MG com ST: o preço lançado precisa incluir o ST retido na nota');
  if(!mg&&f&&rg&&rg.icms_tipo!=='normal'&&(f.st_forma==='a_confirmar'||!f.st_forma)) avisos.push('confirmar com o fornecedor se o ST vem na nota ou é pago em guia (não muda o custo, muda o caixa)');
  if(val&&pYMD(val)>=sod(S.now)&&dayDiff(pYMD(val))<=15) avisos.push('cotação vence em '+dayDiff(pYMD(val))+' dia(s)');
  // custo de aquisição sem frete (mesmas fórmulas da composição de custos)
  var J=+pf.ipi, K=I*J, Sv=0;
  if(L==='ICMS-ST'||L==='ICMS-ST + monofásico'){if(N!=null&&intra!=null&&inter!=null){var Pb=(I+K)*(1+N);Sv=Math.max(0,Pb*intra-I*inter)}}
  else if(L==='Antecipação'&&intra!=null&&inter!=null){var Pa=(I-I*inter)/(1-intra);Sv=Math.max(0,Pa*intra-I*inter)}
  return {p:p,f:f,rg:rg,desc:desc,I:I,J:J,K:K,S:Sv,T:I+K+Sv,icms:icms,icmsAuto:pf.icms_origem==null||pf.icms_origem==='',L:L,M:inter,N:N,O:intra,ft:ft,U:U,V:V,errs:errs,avisos:avisos,ok:!errs.length,data:dt,validade:val};
}
/* Linha usada na cotação: o preferido; se só houver um fornecedor, ele */
function pfCotacao(pid){var l=pfsDe(pid);var p=l.filter(function(x){return x.preferido})[0];return p||(l.length===1?l[0]:null)}
function sitProduto(p){
  var l=pfsDe(p.id), pf=pfCotacao(p.id);
  if(!p.ativo) return {ok:false,txt:'Produto inativo',pf:pf,ci:null};
  if(!l.length) return {ok:false,txt:'Sem fornecedor',pf:null,ci:null};
  if(!pf) return {ok:false,txt:'Escolha o fornecedor preferido',pf:null,ci:null};
  var ci=custoInfo(pf); return {ok:ci.ok,txt:ci.ok?'Pronto para cotar':ci.errs[0]+(ci.errs.length>1?' (+'+(ci.errs.length-1)+')':''),pf:pf,ci:ci};
}

function numIn(id){var v=val(id);if(v==='')return {v:null};var n=pn(v);return n==null?{bad:1}:{v:n}}
function pfRead(soft){
  var g=function(id){return val(id)}, row={};
  row.fornecedor_id=g('pf-forn')||(S.cpEdit.pf&&S.cpEdit.pf.fornecedor_id)||'';
  if(!row.fornecedor_id) return {err:'Escolha o fornecedor.'};
  var q=numIn('pf-qtd'), p=numIn('pf-preco'), ipi=numIn('pf-ipi'), dv=numIn('pf-descov'), ic=numIn('pf-icms');
  if(q.bad||q.v==null||q.v<=0) return {err:'Informe a quantidade por volume (maior que zero).'};
  if(p.bad||p.v==null||p.v<0) return {err:'Informe o preço do volume sem IPI.'};
  if(ipi.bad||(ipi.v!=null&&(ipi.v<0||ipi.v>=50))) return {err:'IPI inválido: digite o percentual, ex.: 3,25.'};
  if(dv.bad||(dv.v!=null&&(dv.v<0||dv.v>=50))) return {err:'Desconto inválido: digite o percentual, ex.: 2.'};
  if(ic.bad||(ic.v!=null&&(ic.v<0||ic.v>=35))) return {err:'ICMS inválido: digite o percentual, ex.: 12.'};
  var dt=g('pf-data'), vl=g('pf-val'); if(dt&&vl&&vl<dt) return {err:'A validade não pode ser antes da data da cotação.'};
  row.codigo_fornecedor=g('pf-cod'); row.descricao_fornecedor=g('pf-desc'); row.unidade_compra=g('pf-ucomp');
  row.qtd_por_volume=q.v; row.preco_volume=p.v; row.ipi=ipi.v==null?0:+(ipi.v/100).toFixed(8); row.desconto_override=dv.v==null?null:+(dv.v/100).toFixed(8); row.icms_origem=ic.v==null?null:+(ic.v/100).toFixed(8);
  row.frete_tipo_override=g('pf-frete')||null; row.cotacao_data=dt||null; row.cotacao_validade=vl||null; row.origem=g('pf-origem'); row.status=g('pf-status')||'tabela';
  row.importado=chk('pf-imp'); row.preferido=chk('pf-pref'); row.obs=g('pf-obs');
  return {row:row};
}

function pctOrNull(id,label,max){var x=numIn(id);if(x.bad)throw new Error(label+': número inválido.');if(x.v==null)return null;if(x.v<0||x.v>=max)throw new Error(label+' fora do intervalo.');return +(x.v/100).toFixed(8)}
function cpErr(e){var m=(e&&e.message)||'';
  if(/duplicate key.*cnpj|fornecedores_cnpj_key/i.test(m)) return 'Já existe um fornecedor com esse CNPJ.';
  if(/produtos_codigo_key/i.test(m)) return 'Já existe um produto com esse código.';
  if(/regras_fiscais_ncm_cest_key/i.test(m)) return 'Já existe uma regra com esse NCM e CEST.';
  if(/produto_fornecedor_produto_id_fornecedor_id_key/i.test(m)) return 'Esse fornecedor já está neste produto.';
  if(/foreign key.*fornecedor/i.test(m)) return 'Esse fornecedor tem produtos vinculados. Remova os vínculos antes de excluir.';
  if(/foreign key.*regra/i.test(m)) return 'Há produtos usando esta regra. Troque a regra deles antes de excluir.';
  if(/MVA antes de ser validada|Só o administrador marca/i.test(m)) return m;
  if(/check constraint/i.test(m)) return 'Algum campo está fora do formato aceito. Confira NCM (0000.00.00), CEST (00.000.00), GTIN e percentuais.';
  return msgErro(e);
}

    var dc=row.cest.replace(/\D/g,''); if(dc&&dc.length!==7) throw new Error('CEST deve ter 7 números.'); row.cest=dc?dc.replace(/^(\d{2})(\d{3})(\d{2})$/,'$1.$2.$3'):'';
    if(!row.descricao) throw new Error('Informe a descrição.');
    row.mva_original=pctOrNull('rg-mva','MVA',500); var al=pctOrNull('rg-aliq','Alíquota interna',40); if(al==null) throw new Error('Informe a alíquota interna.'); row.aliquota_interna=al;
    if(row.icms_tipo!=='normal'&&row.mva_original==null) throw new Error('ICMS-ST precisa da MVA original.');
    if(S.isAdmin) row.validado=chk('rg-val');

}

function linhas(ws){
  if(!ws||!ws['!ref']) return [];
  var XL=window.XLSX, rg=XL.utils.decode_range(ws['!ref']), out=[];
  for(var r=rg.s.r+1;r<=rg.e.r;r++){
    var row=[],vazio=true;
    for(var c=rg.s.c;c<=rg.e.c;c++){
      var cell=ws[XL.utils.encode_cell({r:r,c:c})], v=null;
      if(cell&&cell.v!=null&&cell.v!==''){vazio=false;v={v:cell.v,t:cell.t,z:cell.z||'',w:cell.w}}
      row.push(v);
    }
    if(!vazio) out.push({n:r+1,c:row});
  }
  return out;
}
function cTxt(x){return x==null?'':(x.v instanceof Date?ymd(x.v):(x.t==='n'&&/^0\d/.test(x.w||'')?String(x.w):String(x.v)).trim())}
function cNum(x){if(x==null)return null;if(x.t==='n')return +x.v;var n=pn(String(x.v));return n}
function cPct(x){if(x==null)return null;var n;if(x.t==='n'){n=+x.v;if(/%/.test(x.z))n=n*100}else{n=pn(String(x.v))}return n==null?NaN:n}
function cData(x){if(x==null)return null;if(x.t==='n'){if(!/[dmy]/i.test(x.z||'')&&!(x.v>20000&&x.v<80000))return 'X';var dd=new Date(Date.UTC(1899,11,30)+Math.round(x.v)*864e5);return dd.getUTCFullYear()+'-'+z(dd.getUTCMonth()+1)+'-'+z(dd.getUTCDate())}if(x.v instanceof Date){var d=x.v;return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}var s=String(x.v).trim(),m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s),y,mo,d;if(m){y=+m[3];mo=+m[2];d=+m[1]}else{m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s);if(!m)return 'X';y=+m[1];mo=+m[2];d=+m[3]}var t=new Date(Date.UTC(y,mo-1,d));if(t.getUTCFullYear()!==y||t.getUTCMonth()!==mo-1||t.getUTCDate()!==d)return 'X';return y+'-'+z(mo)+'-'+z(d)}
function cSim(x){var s=cTxt(x).toLowerCase();return s==='sim'||s==='s'||s==='x'}
function fmtNcm(s){var d=String(s||'').replace(/\D/g,'');return d.length===8?d.replace(/^(\d{4})(\d{2})(\d{2})$/,'$1.$2.$3'):null}
function fmtCest(s){var d=String(s||'').replace(/\D/g,'');return !d?'':d.length===7?d.replace(/^(\d{2})(\d{3})(\d{2})$/,'$1.$2.$3'):null}
function validarImport(wb){
  var res={forn:[],prod:[],arquivo:''};
  var fs=wb.Sheets['Fornecedores'], ps=wb.Sheets['Produtos'];
  if(!fs&&!ps) return {erroGeral:'O arquivo não tem as abas "Fornecedores" nem "Produtos". Use o modelo de importação.',forn:[],prod:[]};
  var cnpjsArq={};
  linhas(fs).forEach(function(l){
    var c=l.c, e=[], t0=cTxt(c[0]); if(/^EXEMPLO/i.test(t0)) return;
    var cn=t0.replace(/\D/g,''); if(!cnpjOk(cn)) e.push('CNPJ inválido');
    var uf=cTxt(c[3]).toUpperCase(); if(UFS.indexOf(uf)<0) e.push('UF de origem inválida');
    var reg=cTxt(c[5]).toLowerCase(); reg=reg?(reg.indexOf('simples')>=0?'simples':reg.indexOf('mei')>=0?'mei':reg.indexOf('normal')>=0||reg.indexOf('presumido')>=0||reg.indexOf('real')>=0?'normal':'?'):'';
    if(reg==='?') e.push('regime não reconhecido');
    var ds=cPct(c[6]); if(ds!=null&&(isNaN(ds)||ds<0||ds>=50)) e.push('desconto inválido');
    var ft=cTxt(c[7]).toLowerCase(); ft=ft.indexOf('cif')>=0?'cif':ft.indexOf('busca')>=0||ft.indexOf('própria')>=0?'busca':ft.indexOf('terc')>=0?'terceiro':''; if(!ft) e.push('tipo de frete inválido');
    var vg=cNum(c[8]); if(c[8]&&(vg==null||vg<0)) e.push('custo da viagem inválido'); if(ft&&ft!=='cif'&&vg==null) e.push('falta o custo da viagem');
    var td=cData(c[12]),tv=cData(c[13]); if(td==='X'||tv==='X') e.push('data inválida (use dd/mm/aaaa)'); if(td&&tv&&td!=='X'&&tv!=='X'&&tv<td) e.push('validade antes da data da tabela');
    if(!cTxt(c[1])) e.push('falta a razão social');
    var row={cnpj:cn,razao_social:cTxt(c[1]),nome_fantasia:cTxt(c[2]),origem_uf:uf,origem_cidade:cTxt(c[4]),regime:reg,desconto_avista:ds==null?null:+(ds/100).toFixed(8),frete_tipo:ft,frete_viagem:vg,prazo_pagamento:cTxt(c[9]),pedido_minimo:cTxt(c[10]),prazo_entrega:cTxt(c[11]),tabela_data:td,tabela_validade:tv,contato_nome:cTxt(c[14]),telefone:cTxt(c[15]),email_pedidos:cTxt(c[16]),obs:cTxt(c[17])};
    if(!e.length) cnpjsArq[cn]=1;
    res.forn.push({n:l.n,row:row,e:e,existe:!!S.forn.filter(function(f){return f.cnpj===cn})[0]});
  });
  var vistos={};
  linhas(ps).forEach(function(l){
    var c=l.c, e=[], cod=cTxt(c[0]); if(/^EXEMPLO/i.test(cod)) return;
    if(!cod) e.push('falta o código'); var desc=cTxt(c[1]); if(!desc) e.push('falta a descrição'); else if(desc.length>120) e.push('descrição com mais de 120 caracteres');
    var ncm=fmtNcm(cTxt(c[3])), cest=fmtCest(cTxt(c[4]));
    if(!ncm) e.push('NCM inválido'); if(cest===null) e.push('CEST inválido');
    var rg=ncm&&cest!==null?S.regras.filter(function(r){return r.ncm===ncm&&r.cest===cest})[0]:null;
    if(ncm&&cest!==null&&!rg) e.push('regra fiscal '+ncm+(cest?' / '+cest:'')+' não cadastrada');
    var un_=cTxt(c[5]).toUpperCase(); if(!un_) e.push('falta a unidade de venda');
    var gt=cTxt(c[6]).replace(/\D/g,''); if(gt&&!/^\d{8,14}$/.test(gt)) e.push('GTIN inválido');
    var cat=cTxt(c[7]), catId=null; if(cat){var cc=S.cats.filter(function(x){return x.nome.toLowerCase()===cat.toLowerCase()})[0];if(cc)catId=cc.id;else e.push('categoria "'+cat+'" não existe')}
    var cn=cTxt(c[8]).replace(/\D/g,''); if(!cnpjOk(cn)) e.push('CNPJ do fornecedor inválido'); else if(!S.forn.filter(function(f){return f.cnpj===cn})[0]&&!cnpjsArq[cn]) e.push('fornecedor não cadastrado nem na aba Fornecedores');
    var q=cNum(c[11]); if(q==null||q<=0) e.push('quantidade por volume inválida');
    var pr=cNum(c[12]); if(pr==null||pr<0) e.push('preço inválido');
    var ipi=cPct(c[13]); if(ipi!=null&&(isNaN(ipi)||ipi<0||ipi>=50)) e.push('IPI inválido');
    var icm=cPct(c[19]); if(icm!=null&&(isNaN(icm)||icm<0||icm>=35)) e.push('ICMS inválido');
    var dt=cData(c[15]),vl=cData(c[16]); if(dt==='X'||vl==='X') e.push('data inválida (use dd/mm/aaaa)'); if(dt&&vl&&dt!=='X'&&vl!=='X'&&vl<dt) e.push('validade antes da data da cotação');
    var k=cod+'|'+cn; if(vistos[k]) e.push('linha repetida (mesmo produto e fornecedor na linha '+vistos[k]+')'); vistos[k]=l.n;
    res.prod.push({n:l.n,e:e,cod:cod,cnpj:cn,pref:c[18]!=null?cSim(c[18]):null,
      prod:{codigo:cod,descricao:desc,marca:cTxt(c[2]),regra_id:rg?rg.id:null,unidade_venda:un_,gtin:gt,categoria_id:catId},
      pf:{codigo_fornecedor:cTxt(c[9]),unidade_compra:cTxt(c[10]),qtd_por_volume:q,preco_volume:pr,ipi:ipi==null?0:+(ipi/100).toFixed(8),icms_origem:icm==null||isNaN(icm)?null:+(icm/100).toFixed(8),importado:cSim(c[14]),cotacao_data:dt,cotacao_validade:vl,origem:cTxt(c[17])},
      existe:!!S.prods.filter(function(p){return p.codigo===cod})[0]});
  });
  return res;
}

  h+='<div class="cp-act" style="margin-top:10px">'+(okF.length+okP.length?'<button class="btn pri" data-x="cpimpgo"'+(m.busy?' disabled':'')+'>'+(m.busy?'Importando…':'Importar '+(okF.length+okP.length)+' linha(s) sem erro')+'</button>':'<span class="ct">Nenhuma linha válida para importar.</span>')+(errs.length?'<span class="ct">Corrija as linhas com erro no Excel e importe de novo; as já importadas são apenas atualizadas.</span>':'')+'</div></section>';
  return h;

function semVazios(o){var r={};Object.keys(o).forEach(function(k){if(o[k]!==null&&o[k]!==''&&o[k]!==undefined)r[k]=o[k]});return r}
function executarImport(){
  var m=S.cpImp; if(!m||m.busy) return; m.busy=true; renderMain();
  var okF=m.forn.filter(function(x){return !x.e.length}), okP=m.prod.filter(function(x){return !x.e.length});
  var p=Promise.resolve();
  okF.forEach(function(x){
    p=p.then(function(){
      var ex=S.forn.filter(function(f){return f.cnpj===x.row.cnpj})[0], row=semVazios(x.row);
      return guard(ex?S.sb.from('fornecedores').update(row).eq('id',ex.id):S.sb.from('fornecedores').insert(Object.assign({desconto_avista:0},row)));
    });
  });
  p=p.then(loadCompras);
  okP.forEach(function(x){
    p=p.then(function(){
      var ex=S.prods.filter(function(q){return q.codigo===x.cod})[0], prow=semVazios(x.prod);
      return guard(ex?S.sb.from('produtos').update(prow).eq('id',ex.id).select('id').single():S.sb.from('produtos').insert(prow).select('id').single()).then(function(r){
        var pid=r.data.id, f=S.forn.filter(function(q){return q.cnpj===x.cnpj})[0];
        var exPf=S.pfs.filter(function(q){return q.produto_id===pid&&q.fornecedor_id===f.id})[0];
        var row=semVazios(x.pf); row.ipi=x.pf.ipi; row.importado=x.pf.importado; row.produto_id=pid; row.fornecedor_id=f.id;
        if(x.pref!==null) row.preferido=x.pref; else if(!exPf&&!S.pfs.filter(function(q){return q.produto_id===pid}).length) row.preferido=true;
        return guard(exPf?S.sb.from('produto_fornecedor').update(row).eq('id',exPf.id):S.sb.from('produto_fornecedor').insert(row)).then(function(){
          if(!exPf) S.pfs.push({produto_id:pid,fornecedor_id:f.id,id:'tmp'});
          if(!ex) S.prods.push({id:pid,codigo:x.cod});
        });
      });
    });
  });
  p.then(loadCompras).then(function(){toast('Importação concluída: '+okF.length+' fornecedor(es) e '+okP.length+' linha(s) de produto.');S.cpImp=null;S.cpHist={};renderMain()})
   .catch(function(){m.busy=false;loadCompras().then(renderMain)});
}

/* ---------- verificação em duas etapas (MFA, obrigatória para todos) ---------- */
function traduzMfa(e){
  var m=String((e&&e.message)||e||'');
  if(/invalid|incorrect|expired|verif/i.test(m)) return 'Código incorreto ou vencido. Espere o próximo código do app e tente de novo. Se continuar, confira se o horário do celular está automático.';
  if(/rate|too many/i.test(m)) return 'Muitas tentativas. Aguarde um minuto.';
  if(/disabled|not enabled|mfa_.*_disabled/i.test(m)) return 'A verificação em duas etapas está desligada no Supabase (Authentication > Multi-Factor). Peça ao administrador para ativar o TOTP.';
  return 'Não foi possível verificar: '+m;
}
function nomeAparelho(){var d=new Date();return 'Aparelho '+dm(d)+'/'+d.getFullYear()+' '+hhmm(d)+':'+z(d.getSeconds())}
function qrSrc(q){q=String(q||'');var i=q.indexOf('<svg');if(i<0)return q;try{q=decodeURIComponent(q.slice(i))}catch(e){q=q.slice(i)}return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(q)}
function chaveFmt(k){return String(k||'').replace(/(.{4})/g,'$1 ').trim()}
/* Decide o que mostrar depois da senha: app (já verificado), código, ou cadastro do app */
function afterAuth(){
  if(!S.session||S.authMode==='recovery'||S.gating) return;
  if(S.started&&S.started===S.session.user.id) return;
  S.gating=true;S.mfa={mode:'carregando'};render();
  mfaGate().then(function(ok){S.gating=false;if(ok){S.mfa=null;startData()}else render()})
    .catch(function(e){S.gating=false;S.mfa={mode:'erro',msg:traduzMfa(e)};render()});
}
function verificados(f){var all=(f&&f.data&&(f.data.all||[].concat(f.data.totp||[])))||[];return {ok:all.filter(function(x){return x.factor_type==='totp'&&x.status==='verified'}),pend:all.filter(function(x){return x.status!=='verified'})}}
function mfaGate(){
  var A=S.sb.auth.mfa;
  return A.getAuthenticatorAssuranceLevel().then(function(r){
    if(r.error) throw r.error;
    if(r.data&&r.data.currentLevel==='aal2') return true;
    return A.listFactors().then(function(f){
      if(f.error) throw f.error;
      var v=verificados(f);
      if(v.ok.length){S.mfa={mode:'codigo',factorId:v.ok[0].id,factors:v.ok};return false}
      return novoFator().then(function(n){S.mfa={mode:'cadastro',factorId:n.id,qr:n.qr,secret:n.secret};return false});
    });
  });
}
/* Cria um fator TOTP novo (apaga antes os cadastros que ficaram pela metade) */
function novoFator(){
  var A=S.sb.auth.mfa;
  return A.listFactors().then(function(f){
    var pend=verificados(f).pend;
    return Promise.all(pend.map(function(x){return A.unenroll({factorId:x.id})}));
  }).then(function(){return A.enroll({factorType:'totp',friendlyName:nomeAparelho()})}).then(function(e){
    if(e.error) throw e.error;
    return {id:e.data.id,qr:e.data.totp.qr_code,secret:e.data.totp.secret};
  });
}
function mfaPasso(factorId,code){
  var A=S.sb.auth.mfa;
  return A.challenge({factorId:factorId}).then(function(c){
    if(c.error) throw c.error;
    return A.verify({factorId:factorId,challengeId:c.data.id,code:code});
  }).then(function(v){if(v.error)throw v.error;return v});
}
function mfaEntrar(){

  }
  var logs=[],patch=Object.assign({},f),remarcou=false,mudouResp=false,pend=old.fase!==f.fase?pendAviso(old.id,old.fase):'';
  if(old.disputa!==f.disputa){
    if(old.disputa&&f.disputa){logs.push('Remarcada: de '+fmtDT(old.disputa)+' para '+fmtDT(f.disputa));remarcou=true}
    else logs.push('Data da disputa definida: '+fmtDT(f.disputa));
  }
  if(old.fase!==f.fase) logs.push('Fase: '+faseNome(old.fase)+' → '+faseNome(f.fase));
  if((old.responsavel||'')!==a.responsavel){
    logs.push('Responsável: '+(old.responsavel?nomeDe(old.responsavel):'ninguém')+' → '+(a.responsavel?nomeDe(a.responsavel):'ninguém'));
    mudouResp=!!a.responsavel;
  }
  var nomes={orgao:'órgão',categoriaId:'categoria',modalidade:'modalidade',numero:'número',itens:'itens',garantia:'garantia',regional:'regional',catalogo:'catálogo',habApos:'habilitação'};
  Object.keys(nomes).forEach(function(k){if((old[k]||'')!==(all[k]||'')) logs.push('Campo alterado: '+nomes[k])});
  if((old.obs||'')!==f.obs) logs.push('Observações atualizadas');
  if(!logs.length){closeModal();return}
  if(adm) Object.assign(patch,a);
  patchBid(id,patch,logs,function(){
    if(remarcou&&a.responsavel) avisar(id,'remarcada');
    if(mudouResp) avisar(id,'atribuida');
  }).then(function(){closeModal();toast(remarcou&&a.responsavel?'Remarcação salva e '+nomeDe(a.responsavel).split(' ')[0]+' foi avisado(a).'+pend:'Alterações salvas.'+pend)}).catch(fail);
}
function addComment(){
  var t=val('f-cm'); if(!t) return; var id=S.openId;
  guard(S.sb.from('comentarios').insert({licitacao_id:id,texto:t})).then(function(){
    return S.sb.from('historico').insert({licitacao_id:id,texto:'Comentário adicionado'});
  }).then(function(){return loadDetail(id)}).catch(function(){});
}
function delBid(){
  if(!S.isAdmin) return;
  var id=S.openId;
  guard(S.sb.from('licitacoes').delete().eq('id',id)).then(function(){return loadLic()}).then(function(){closeModal();renderMain();toast('Licitação excluída.')}).catch(function(){});
}
/* ---------- equipe: ações ---------- */
function saveMember(){
  var nome=val('mn'); if(!nome){toast('Informe o nome.');return}
  var novo=S.editMember==='new', senha=($('#ms')||{value:''}).value;
  var corpo={acao:novo?'criar':'editar',id:novo?undefined:S.editMember,nome:nome,email:val('me1'),whatsapp:val('mw'),papel:val('mp'),senha:senha};
  if(!novo) corpo.ativo=chk('ma');
  if(novo&&!corpo.email){toast('Informe o e-mail de login.');return}
  var btn=$('[data-act="msave"]'); if(btn) btn.disabled=true;
  chamar('admin-usuarios',corpo).then(function(){S.editMember=null;return loadPerfis()}).then(function(){renderTop();renderMain();toast(novo?'Pessoa adicionada.':'Dados atualizados.')})
    .catch(function(e){if(btn)btn.disabled=false;toast(e.message||'Não foi possível salvar.')});
}
function removeMember(id){
  chamar('admin-usuarios',{acao:'remover',id:id}).then(function(){S.confirmRm=null;return Promise.all([loadPerfis(),loadLic()])}).then(function(){renderTop();renderMain();toast('Pessoa removida.')})
    .catch(function(e){toast(e.message||'Não foi possível remover.')});
}
function readAll(){
  if(!S.me) return;
  S.sb.from('avisos').update({lida:true}).eq('para_id',S.me.id).eq('lida',false).then(function(){return loadAvisos()}).then(function(){renderTop()});
}
/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var tab=t.closest('[data-tab]'); if(tab){S.tab=tab.dataset.tab;lsSet('tab',S.tab);S.bell=false;if(S.tab==='hist')loadHistAll();render();return}
  var g=t.closest('[data-group]'); if(g){S.group=g.dataset.group;lsSet('group',S.group);renderMain();return}
  var a=t.closest('[data-act]');
  if(a){
    var act=a.dataset.act;
    if(a.tagName==='A') e.preventDefault();
    if(act==='login'){doLogin();return}
    if(act==='forgot'){doForgot();return}
    if(act==='recsave'){doRecovery();return}
    if(act==='mfaok'){mfaEntrar();return}
    if(act==='mfaretry'){S.authMsg='';afterAuth();return}
    if(act==='mfacopy'){try{navigator.clipboard.writeText(S.mfa.secret);toast('Chave copiada.')}catch(e2){}return}
    if(act==='pfadd'){pfAdd();return}
    if(act==='pfok'){pfConfirm();return}
    if(act==='pfcancel'){pfCancel();return}
    if(act==='pfrm'){pfRemove(a.dataset.id);return}
    if(act==='mfarst'){S.confirmMfa=a.dataset.id;renderMain();return}
    if(act==='mfarstno'){S.confirmMfa=null;renderMain();return}
    if(act==='mfarstyes'){resetMfa(a.dataset.id);return}
    if(act==='sair'){S.sb.auth.signOut();return}
    if(act==='perfil'){openProfile();return}
    if(act==='psave'){saveProfile();return}
    if(act==='new'){e.stopPropagation();openModal('new',a.dataset.fase);return}
    if(act==='close'){closeModal();return}
    if(act==='save'){save();return}
    if(act==='comment'){addComment();return}
    if(act==='delask'){S.confirmDel=true;var id=S.openId;var keep=collectDraft();openModal(id);applyDraft(keep);return}
    if(act==='delno'){S.confirmDel=false;var id2=S.openId;var k2=collectDraft();openModal(id2);applyDraft(k2);return}
    if(act==='delyes'){delBid();return}
    if(act==='mnew'){S.editMember='new';renderMain();var i=$('#mn');if(i)i.focus();return}
    if(act==='medit'){S.editMember=a.dataset.id;renderMain();return}
    if(act==='mcancel'){S.editMember=null;renderMain();return}
    if(act==='msave'){saveMember();return}
    if(act==='mrm'){S.confirmRm=a.dataset.id;renderMain();return}
    if(act==='mrmno'){S.confirmRm=null;renderMain();return}
    if(act==='mrmyes'){removeMember(a.dataset.id);return}
    if(act==='cadd'){addCat();return}
    if(act==='cedit'){S.editCat=a.dataset.id;S.confirmCat=null;renderMain();var ce=$('#cn-edit');if(ce){ce.focus();ce.select()}return}
    if(act==='ccancel'){S.editCat=null;renderMain();return}
    if(act==='csave'){saveCat(a.dataset.id);return}
    if(act==='crm'){S.confirmCat=a.dataset.id;S.editCat=null;renderMain();return}
    if(act==='cno'){S.confirmCat=null;renderMain();return}
    if(act==='cyes'){rmCat(a.dataset.id);return}
    if(act==='readall'){readAll();return}
    if(act==='pclear'){S.pm='todos';S.pd='';S.pmes='';S.pano='';renderMain();return}
    if(act==='opennote'){
      var n=null;for(var i3=0;i3<S.notifs.length;i3++)if(S.notifs[i3].id===a.dataset.id)n=S.notifs[i3];
      if(n&&!n.lida){S.sb.from('avisos').update({lida:true}).eq('id',n.id).then(function(){return loadAvisos()}).then(function(){renderTop()})}
      S.bell=false;renderPop();
      if(n&&n.tipo==='tarefa'){S.tab='conversas';S.conv='tarefas';S.tview='minhas';lsSet('tab',S.tab);render();return}
      if(fresh(a.dataset.bid)) openModal(a.dataset.bid);
      return;
    }
  }
  var o=t.closest('[data-open]');
  if(o){e.preventDefault();openModal(o.dataset.open);return}
  if(t.id==='ov'){closeModal();return}
  if(t.closest('#bell')){S.bell=!S.bell;renderPop();return}
  if(S.bell&&!t.closest('#pop')){S.bell=false;renderPop()}
});
function collectDraft(){
  var d={};['f-orgao','f-cat','f-mod','f-num','f-itens','f-disp','f-fase','f-resp','f-obs','f-cm'].forEach(function(k){var e=$('#'+k);if(e)d[k]=e.value});
  ['f-gar','f-reg','f-cat2','f-hab'].forEach(function(k){var e=$('#'+k);if(e)d[k]=e.checked});
  return d;
}
function applyDraft(d){Object.keys(d).forEach(function(k){var e=$('#'+k);if(!e)return;if(typeof d[k]==='boolean')e.checked=d[k];else e.value=d[k]})}
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='lg-email'||e.target.id==='lg-pass')){e.preventDefault();doLogin();return}
  if(e.key==='Enter'&&(e.target.id==='rc-pass'||e.target.id==='rc-pass2'||e.target.id==='rc-code')){e.preventDefault();doRecovery();return}
  if(e.key==='Enter'&&e.target.id==='mfa-code'){e.preventDefault();mfaEntrar();return}
  if(e.key==='Enter'&&e.target.id==='pf-mfa-code'){e.preventDefault();pfConfirm();return}
  if(e.key==='Enter'&&e.target.id==='cn'){e.preventDefault();addCat();return}
  if(e.key==='Enter'&&e.target.id==='cn-edit'&&S.editCat){e.preventDefault();saveCat(S.editCat);return}
  if(e.key==='Escape'){if(S.openId){closeModal()}else if(S.bell){S.bell=false;renderPop()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();openModal(e.target.dataset.open)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderMain()}
  if(e.target.id==='lg-email'){S.lgEmail=e.target.value}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='mfa-fator'&&S.mfa){S.mfa.factorId=e.target.value;return}
  if(id==='fresp'){S.resp=e.target.value;renderMain()}
  else if(id==='fcat'){S.cat=e.target.value;renderMain()}
  else if(id==='fmine'){S.mine=e.target.checked;renderMain()}
  else if(id==='pm'){S.pm=e.target.value;var n=S.now,y=n.getFullYear();
    if(S.pm==='dia'&&!S.pd)S.pd=y+'-'+z(n.getMonth()+1)+'-'+z(n.getDate());
    if(S.pm==='mes'&&!S.pmes)S.pmes=y+'-'+z(n.getMonth()+1);
    if(S.pm==='ano'&&!S.pano)S.pano=y;
    renderMain()}
  else if(id==='pd'){S.pd=e.target.value;renderMain()}
  else if(id==='pmes'){S.pmes=e.target.value;renderMain()}
  else if(id==='pano'){S.pano=e.target.value;renderMain()}
});
/* arrastar e soltar */
document.addEventListener('dragstart',function(e){
  var c=e.target.closest&&e.target.closest('.card'); if(!c) return;
  e.dataTransfer.setData('text/plain',c.dataset.open);e.dataTransfer.effectAllowed='move';c.classList.add('drag');
});
document.addEventListener('dragend',function(e){var c=e.target.closest&&e.target.closest('.card');if(c)c.classList.remove('drag');Array.prototype.forEach.call(document.querySelectorAll('.col.over'),function(x){x.classList.remove('over')})});
document.addEventListener('dragover',function(e){var c=e.target.closest&&e.target.closest('.col');if(c&&S.group!=='dia'){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',function(e){var c=e.target.closest&&e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',function(e){
  var c=e.target.closest&&e.target.closest('.col'); if(!c||S.group==='dia') return;
  e.preventDefault();c.classList.remove('over');
  var id=e.dataTransfer.getData('text/plain'); if(id) moveBid(id,c.dataset.k);
});

/* ---------- inicialização ---------- */
function stopData(){
  if(S.chan){try{S.sb.removeChannel(S.chan)}catch(e){}S.chan=null}
  S.started='';S.me=null;S.isAdmin=false;S.rows=[];S.bids=[];S.members=[];S.cats=[];S.notifs=[];S.histAll=[];S.detail=null;S.openId=null;S.ready=false;
  S.v2=false;S.v2off='';S.pf=null;S.forn=[];S.regras=[];S.prods=[];S.pfs=[];S.v7=false;S.v7off='';S.cpImp=null;S.cpHist={};S.cpEdit=null;S.confirmMfa=null;S.permPad={};S.permUser=[];S.cfg=null;S.fmetas=[];S.fregs=[];S.emp=[];S.proc=[];S.ck={};S.plano=[];S.tarefas=[];S.msgs=[];S.leit={};S.aval=[];S.contatos=[];S.v5=false;S.drafts={};S.ctOpen=null;S.tf=null;S.cvDraft='';S.avDraft={notas:{},obs:{}};
  $('#modal-root').innerHTML='';
}
var timers={};
function typingNow(){var a=document.activeElement,m=$('#main');return !!(a&&m&&m.contains(a)&&a.id!=='q'&&a.id!=='cp-q'&&a.id!=='cv-txt'&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!/checkbox|radio|button/.test(a.type))))}
function later(k,fn){clearTimeout(timers[k]);timers[k]=setTimeout(function(){fn().then(function(){if(k==='avisos'){renderTop();return}if(typingNow()){S.dirty=true;renderTop();return}render()}).catch(function(){})},250)}
document.addEventListener('focusout',function(){setTimeout(function(){if(S.dirty&&!typingNow()){S.dirty=false;render()}},300)});
function subscribeRealtime(){
  if(S.chan) return;
  var ch=S.sb.channel('bee-live');
  ch.on('postgres_changes',{event:'*',schema:'public',table:'licitacoes'},function(){later('lic',loadLic)});
  ch.on('postgres_changes',{event:'*',schema:'public',table:'categorias'},function(){later('cat',function(){return loadCats()})});
  ch.on('postgres_changes',{event:'*',schema:'public',table:'perfis'},function(){later('per',loadPerfis)});
  ch.on('postgres_changes',{event:'*',schema:'public',table:'avisos'},function(){later('avisos',loadAvisos)});
  if(S.v2) subscribeV2(ch);
  ch.subscribe();
  S.chan=ch;
}
function startData(){
  if(!S.session||S.started===S.session.user.id) return;
  S.started=S.session.user.id;S.ready=false;S.err='';render();
  loadPerfis().then(function(){
    if(!S.me||!S.me.ativo){S.err='Sua conta ainda não tem acesso ao painel. Fale com o administrador.';S.ready=true;render();return}
    return loadCats().then(function(){return Promise.all([loadLic(),loadAvisos(),loadV2()])}).then(function(){S.ready=true;subscribeRealtime();render()});
  }).catch(function(e){S.err='Não foi possível carregar os dados: '+((e&&e.message)||'erro');S.ready=true;render()});
}
function bootAuth(){
  var cfg=window.BEE_CONFIG||{};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||/COLE_/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY)){S.err='Falta configurar o arquivo config.js com o endereço e a chave do seu projeto Supabase.';render();return}
  if(!window.supabase){S.err='Não foi possível carregar o Supabase. Verifique a conexão com a internet.';render();return}
  S.sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb.auth.onAuthStateChange(function(ev,session){
    S.authReady=true;S.session=session;
    if(ev==='PASSWORD_RECOVERY'){S.authMode='recovery';S.mfa=null;setTimeout(function(){recCheck().then(render)},0);return}
    if(!session){setTimeout(function(){stopData();S.mfa=null;S.rec=null;S.authMsg='';render()},0);return}
    if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED'||ev==='MFA_CHALLENGE_VERIFIED') return;
    setTimeout(afterAuth,0);
  });
}
render();
bootAuth();
/* recalcula "hoje / amanhã / em atraso" a cada minuto, sem gravar nada */
setInterval(function(){S.now=new Date();if(S.session&&S.me&&!S.openId&&!S.editMember&&!typingNow()&&!S.tf)render()},60000);
})();
</script>
